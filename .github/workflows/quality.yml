name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Adrenalina.slnx

      - name: Build
        run: dotnet build Adrenalina.slnx --no-restore --configuration Release --verbosity minimal

      - name: Test
        run: dotnet test tests/Adrenalina.Tests/Adrenalina.Tests.csproj --no-restore --configuration Release --verbosity normal

      - name: Audit packages
        run: dotnet list Adrenalina.slnx package --vulnerable --include-transitive
